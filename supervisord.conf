[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:mysqld]
command=/usr/sbin/mysqld --datadir=/var/lib/mysql --user=mysql
user=mysql
autostart=true
autorestart=true
stdout_logfile=/var/log/mysqld.log
stderr_logfile=/var/log/mysqld.err.log

[program:nodeapp]
command=node .next/standalone/server.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/nodeapp.log
stderr_logfile=/var/log/nodeapp.err.log
